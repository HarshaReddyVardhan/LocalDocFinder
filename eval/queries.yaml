# Evaluation set for `ldf eval`. Replace/extend with 30-50 queries about YOUR real projects.
#   corpus : directories to index for the comparison (relative paths are relative to this file)
#   models : embedding models to compare (each needs `ollama pull <name>`)
#   expect : any of these substrings in a result's path counts as a hit
# The queries below are about this repo itself, so the harness works out of the box.
corpus:
  - ../src
models:
  - qwen3-embedding:0.6b
  - bge-m3
  - nomic-embed-text

queries:
  - q: where is the list of secret file patterns like .env and pem keys
    expect: [core/settings.py, core/scope.py]
  - q: decide whether indexing is allowed while the laptop is unplugged
    expect: [core/power.py, worker.py]
  - q: run OCR with the built-in Windows engine
    expect: [extractors/ocr.py]
  - q: split a markdown file into sections by heading
    expect: [extractors/markdown.py]
  - q: extract headings and tables from word documents
    expect: [extractors/docx.py]
  - q: render scanned pdf pages and OCR them
    expect: [extractors/pdf.py]
  - q: register a global keyboard shortcut to open the search window
    expect: [app/hotkey.py]
  - q: combine vector and keyword rankings into one list
    expect: [core/retrieval.py, skills/search.py]
  - q: wait before processing a file that was just saved
    expect: [watcher.py, store/sqlite.py]
  - q: mask passport and social security numbers before sending text to the cloud
    expect: [privacy/detectors.py, privacy/mask.py, privacy/policy.py]
  - q: score a resume against the requirement checklist
    expect: [match/scoring.py, match/judge.py]
  - q: unload the chat model when the laptop is unplugged or a game starts
    expect: [core/llm.py]
  - q: classify a document as resume or invoice
    expect: [doctypes/base.py]
  - q: chunk python code by function and class with tree-sitter
    expect: [extractors/code.py]
