# Evaluation set for `ldf eval`. Replace/extend with 30-50 queries about YOUR real projects.
#   corpus : directories to index for the comparison (relative paths are relative to this file)
#   models : embedding models to compare (each needs `ollama pull <name>`)
#   expect : any of these substrings in a result's path counts as a hit
#   expect_none : true for a question nothing in the corpus answers (any top-5 result is a
#                 false positive)
#   not    : path substrings that must stay out of the top 5
# The queries below are about this repo itself plus a small corpus of scanned documents and
# photos (tests/fixtures/eval_corpus, made by scripts/make_eval_fixtures.py), so the harness
# works out of the box. scan_0042.pdf and blank_scan.pdf hold nothing but a scanner watermark
# and dust: they must never rank for a real query.
corpus:
  - ../src
  - ../tests/fixtures/eval_corpus
models:
  - qwen3-embedding:0.6b
  - qwen3-embedding:4b
  - bge-m3

queries:
  - q: where is the list of secret file patterns like .env and pem keys
    expect: [core/settings.py, core/scope.py]
  - q: decide whether indexing is allowed while the laptop is unplugged
    expect: [core/power.py, worker.py]
  - q: run OCR with the built-in Windows engine
    expect: [extractors/ocr.py]
  - q: split a markdown file into sections by heading
    expect: [extractors/markdown.py]
  - q: extract headings and tables from word documents
    expect: [extractors/docx.py]
  - q: render scanned pdf pages and OCR them
    expect: [extractors/pdf.py]
  - q: register a global keyboard shortcut to open the search window
    expect: [app/hotkey.py]
  - q: combine vector and keyword rankings into one list
    expect: [core/retrieval.py, skills/search.py]
  - q: wait before processing a file that was just saved
    expect: [watcher.py, store/sqlite.py]
  - q: mask passport and social security numbers before sending text to the cloud
    expect: [privacy/detectors.py, privacy/mask.py, privacy/policy.py]
  - q: score a resume against the requirement checklist
    expect: [match/scoring.py, match/judge.py]
  - q: unload the chat model when the laptop is unplugged or a game starts
    expect: [core/llm.py]
  - q: classify a document as resume or invoice
    expect: [doctypes/base.py]
  - q: chunk python code by function and class with tree-sitter
    expect: [extractors/code.py]

  # Scanned documents and photos: found by their OCR text, never by being "average".
  - q: monthly rent and security deposit for the apartment
    expect: [lease_agreement_scan.pdf]
    not: [scan_0042.pdf, blank_scan.pdf]
  - q: is a pet allowed in the rented flat
    expect: [lease_agreement_scan.pdf]
    not: [scan_0042.pdf, blank_scan.pdf]
  - q: migrate the billing database to postgres
    expect: [whiteboard_photo.jpg]
    not: [scan_0042.pdf, blank_scan.pdf, IMG_2041.jpg]
  - q: sprint planning deadline friday
    expect: [whiteboard_photo.jpg]
    not: [scan_0042.pdf, blank_scan.pdf]
  - q: passport photo
    expect: [passport.jpg]
    not: [scan_0042.pdf]

  # The junk scan must not show up for queries about code either.
  - q: open the vector store and create the full text index
    expect: [store/lance.py]
    not: [scan_0042.pdf, blank_scan.pdf, IMG_2041.jpg]
  - q: parse search filters like type and ext from the query
    expect: [skills/search.py]
    not: [scan_0042.pdf, blank_scan.pdf]

  # Nothing in the corpus answers these: every result is a false positive.
  - q: chocolate chip cookie recipe with brown butter
    expect_none: true
  - q: flight booking confirmation to Tokyo in April
    expect_none: true
  - q: quarterly sales figures for the european region
    expect_none: true
  - q: my doctor's appointment next tuesday
    expect_none: true
  - q: zebra migration across the serengeti
    expect_none: true
