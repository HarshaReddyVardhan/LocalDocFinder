[project]
name = "vector-embed"
version = "0.1.0"
description = "Local semantic search and chat-with-documents engine (Ollama-backed)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pathspec>=0.12",
    "psutil>=5.9",
    "ollama>=0.4",
    "openai>=1.40",
    "keyring>=25",
    "lancedb",
    "pyarrow",
    "numpy",
    "xxhash",
    "watchdog",
    "pyyaml",
    "tomli-w>=1.0",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "tree-sitter-language-pack",
    "nvidia-ml-py",
    "pillow",
    "imagehash",
    "PySide6",
    "winrt-runtime; sys_platform == 'win32'",
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Storage; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.Globalization; sys_platform == 'win32'",
    "mcp>=2,<3",
]

[project.scripts]
ve = "vector_embed.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "types-psutil",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_embed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RET", "PL", "RUF", "S", "T20", "N", "ANN",
]
ignore = [
    "PLR2004",  # magic-value compares in tests/guards
    "S101",  # assert is fine under pytest and for narrowing
    "PLR0913",  # constructors take injected collaborators by design
    "PLC0415",  # heavy imports (lancedb, ollama, PySide6) are deliberately lazy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = ["vector_embed"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["vector_embed.core.extractors.pdf"]
disallow_untyped_calls = false  # pymupdf is only partially typed

[[tool.mypy.overrides]]
module = ["pathspec.*", "pyarrow.*", "lancedb.*", "pynvml.*", "winrt.*", "imagehash.*", "fitz.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]   # "." lets tests import shared helpers as tests.core.*
addopts = "-ra --strict-markers"
markers = ["ollama: needs a running Ollama server with the model pulled"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/vector_embed"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
