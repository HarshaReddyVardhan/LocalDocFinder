repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^uv\.lock$
      - id: detect-private-key
        exclude: ^tests/core/privacy/  # fixtures hold fake key markers on purpose
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv\\Scripts\\ruff.exe check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv\\Scripts\\ruff.exe format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv\\Scripts\\python.exe -m mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/
